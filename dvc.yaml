stages:
  build_data:
    cmd: python -u build_training_set.py
    deps:
      - build_training_set.py
      - data/merged_data.csv
      - data/master_store_family_dataset.csv
    outs:
      - training_table.parquet   # falls back to training_table.csv if pyarrow isn't installed

  train:
    cmd: python -u train_lightgbm.py
    deps:
      - train_lightgbm.py
      - asof_features.py
      - build_training_set.py
      - training_table.parquet
    params:
      - params.yaml:
          - asymmetric_loss
          - walk_forward
          - lightgbm
          - training
    outs:
      - models/
    metrics:
      - metrics.json:
          cache: false
    plots:
      - fold_metrics.csv:
          x: fold
          y: val_asymmetric_mse
          cache: false

  train_arima:
    cmd: python -u train_arima.py
    deps:
      - train_arima.py
      - build_training_set.py
      - training_table.parquet
    params:
      - params.yaml:
          - asymmetric_loss
          - walk_forward
          - arima
    metrics:
      - metrics_arima.json:
          cache: false
    plots:
      - fold_metrics_arima.csv:
          x: fold
          y: val_asymmetric_mse
          cache: false

  train_prophet:
    cmd: python -u train_prophet.py
    deps:
      - train_prophet.py
      - build_training_set.py
      - training_table.parquet
    params:
      - params.yaml:
          - asymmetric_loss
          - walk_forward
          - prophet
    metrics:
      - metrics_prophet.json:
          cache: false
    plots:
      - fold_metrics_prophet.csv:
          x: fold
          y: val_asymmetric_mse
          cache: false

  train_prophet_representative:
    cmd: python -u train_prophet_representative.py
    deps:
      - train_prophet_representative.py
      - build_training_set.py
      - training_table.parquet
    params:
      - params.yaml:
          - asymmetric_loss
          - walk_forward
          - prophet_representative
    metrics:
      - metrics_prophet_representative.json:
          cache: false
    plots:
      - fold_metrics_prophet_representative.csv:
          x: fold
          y: val_asymmetric_mse
          cache: false

  train_sarima_cluster:
    cmd: python -u train_sarima_by_cluster.py
    deps:
      - train_sarima_by_cluster.py
      - build_training_set.py
      - training_table.parquet
    params:
      - params.yaml:
          - asymmetric_loss
          - walk_forward
          - sarima_cluster
    metrics:
      - metrics_sarima_cluster.json:
          cache: false
    plots:
      - fold_metrics_sarima_cluster.csv:
          x: fold
          y: val_asymmetric_mse
          cache: false