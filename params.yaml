asymmetric_loss:
  alpha: 2.0          # underprediction penalty multiplier -- tune against real cost ratio

walk_forward:
  n_splits: 5
  horizon: 15         # days per fold -- match your real production forecast horizon
  gap: 0              # increase if rolling features longer than horizon risk boundary leakage

lightgbm:
  num_leaves: 63
  learning_rate: 0.05
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 5
  verbose: -1
  seasonality_method: cheap   # 'cheap' (seconds, vectorized proxy) or 'prophet' (30-90 min, more accurate) -- use cheap while iterating, switch to prophet for a final run

training:
  num_boost_round: 2000
  early_stopping_rounds: 50

arima:
  # NOTE: seasonal: true + seasonal_period below means this is already
  # fitting SARIMA (auto_arima searches seasonal (P,D,Q,m) orders too,
  # not just non-seasonal (p,d,q)) -- the name "arima" here is just the
  # filename/legacy label, not a statement that seasonality is off.
  n_jobs: -1
  min_train_days: 60
  seasonal: true
  seasonal_period: 7
  max_p: 5
  max_q: 5
  max_d: 2

sarima_cluster:
  n_jobs: -1
  min_train_days: 60
  cluster_column: hier_cluster    # swap to volume_cluster/nested_cluster/sparse_cluster to compare schemes
  use_exogenous: true             # SARIMAX: passes onpromotion/is_holiday/oil_price as regressors
  seasonal: true
  seasonal_period: 7
  max_p: 5
  max_q: 5
  max_d: 2
  max_P: 2
  max_Q: 2
  max_D: 1
  information_criterion: aic      # or 'bic' -- bic penalizes complexity more, aic is the pmdarima default

prophet:
  n_jobs: -1
  min_train_days: 60
  weekly_seasonality: true
  yearly_seasonality: true
  changepoint_prior_scale: 0.05   # default; raise if series show more trend shifts than Prophet is capturing

prophet_representative:
  cluster_column: hier_cluster       # which clustering defines the ~10 "typical series" to study
  n_per_cluster: 2                   # hier_cluster has 4 real groups -> 8 representative series total; raise to hit ~10
  selection_features: [average_demand, CV2_weekly_nonzero, ADI_weekly,
                        weekly_seasonality_strength, annual_seasonality_strength]
  min_train_days: 60
  weekly_seasonality: true
  yearly_seasonality: true
  changepoint_prior_scale: 0.05