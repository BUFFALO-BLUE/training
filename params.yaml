asymmetric_loss:
  alpha: 2.0          # underprediction penalty multiplier -- tune against real cost ratio

walk_forward:
  n_splits: 5
  horizon: 15         # days per fold -- match your real production forecast horizon
  gap: 0              # increase if rolling features longer than horizon risk boundary leakage

lightgbm:
  num_leaves: 63
  learning_rate: 0.05
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 5
  verbose: -1

training:
  num_boost_round: 2000
  early_stopping_rounds: 50

arima:
  n_jobs: -1              # -1 = use all cores; 1,782 series x n_splits fits benefit heavily from parallelism
  min_train_days: 60      # skip a series/fold if too little history to fit meaningfully
  seasonal: true
  seasonal_period: 7      # weekly seasonality on daily data
  max_p: 5
  max_q: 5
  max_d: 2

prophet:
  n_jobs: -1
  min_train_days: 60
  weekly_seasonality: true
  yearly_seasonality: true
  changepoint_prior_scale: 0.05   # default; raise if series show more trend shifts than Prophet is capturing
